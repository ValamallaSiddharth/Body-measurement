[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-photo-bodymeasure"
version = "0.3.0"
description = "Uncalibrated two-photo adult body measurement estimates"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["bodymeasure*"]

[project.scripts]
bodymeasure = "bodymeasure.cli:main"
bodymeasure-server = "bodymeasure.web:main"

[tool.setuptools.package-data]
bodymeasure = ["templates/*.html"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1"]
server = ["gunicorn>=23,<26; sys_platform != 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/evaluate.py" = ["E402"]
"tests/verify_http.py" = ["E402"]
