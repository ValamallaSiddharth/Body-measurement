name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install '.[dev,server]'
      - run: python -m pip check
      - run: ruff check app.py bodymeasure scripts tests gunicorn.conf.py
      - run: pytest -q
      - run: node tests/test_frontend.cjs
      - run: python -m build
      - run: gunicorn --check-config --config gunicorn.conf.py bodymeasure.web:app
      - run: docker build -t bodymeasure:test .
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
